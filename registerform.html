<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width" initial-scale="1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Google Fonts for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p class="subtitle">Fill in the details to register your new account</p>
    </div>

    <form action="index.html" method="get">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 chars" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" minlength="6" required>
        </div>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="gender" value="male" required> Male</label>
          <label class="radio-label"><input type="radio" name="gender" value="female"> Female</label>
          <label class="radio-label"><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">-- Select country --</option>
          <option value="bangladesh">Bangladesh</option>
          <option value="india">India</option>
          <option value="usa">USA</option>
          <option value="uk">UK</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="terms" required> 
          <span>I agree to the <a href="#" class="link">Terms &amp; Conditions</a></span>
        </label>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <p class="switch-text">Already have an account? <a href="index.html">Login here</a></p>
  </div>

</body>
</html>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
