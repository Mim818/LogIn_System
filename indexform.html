<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-class">
        <h1>Sign in</h1>
  <p class="subtitle">Access your dashboard by entering your details</p>

<form action="dashboard.html" method="get">
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="name@domain.com" required>
</div>

<div class="form-group">
    <label for="password">Security Password</label>
<input type="password" id="password" name="password" placeholder="••••••••" required>
</div>

<div class="form-row">
<label class="checkbox"><input type="checkbox" name="remember"> Keep me signed in</label>
<a href="#">Reset password?</a>
</div>

<button type="submit" class="btn">Sign In</button>
</form>

<p class="switch-text">New user here? <a href="register.html">Create an account</a></p>
</div>
    
    
</body>
</html>
